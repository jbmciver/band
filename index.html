<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* v2 layout: in-flow header, three views (This week, My dates, Messages) switched by a fixed bottom tab bar. Large type for older eyes, rem-based so the Text size setting scales everything. */
:root{--fs:17px;--bg:#f1f3f7;--surface:#ffffff;--ink:#0f1629;--muted:#36415c;--line:#cfd5e1;--line-strong:#9aa3b8;--navy:#22305a;--on-navy:#ffffff;--brass:#8f620f;--on-brass:#ffffff;--brass-soft:#f4e8cf;--ok:#17673a;--ok-soft:#dcf1e3;--bad:#a8231b;--bad-soft:#fbe1de;--wait:#6e4a00;--wait-soft:#fdefc3;--focus:#1f5fd6;--scrim:rgba(8,12,22,.55);
--f-body:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151f;--surface:#1b2130;--ink:#f1f3f8;--muted:#c2cadb;--line:#363f55;--line-strong:#59637c;--navy:#aebde9;--on-navy:#11151f;--brass:#e3b45c;--on-brass:#1b1406;--brass-soft:#3a2f18;--ok:#86d8a6;--ok-soft:#173424;--bad:#f39a90;--bad-soft:#3d1d1a;--wait:#f2cf6a;--wait-soft:#3a3014;--focus:#8db4ff;--scrim:rgba(0,0,0,.65);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151f;--surface:#1b2130;--ink:#f1f3f8;--muted:#c2cadb;--line:#363f55;--line-strong:#59637c;--navy:#aebde9;--on-navy:#11151f;--brass:#e3b45c;--on-brass:#1b1406;--brass-soft:#3a2f18;--ok:#86d8a6;--ok-soft:#173424;--bad:#f39a90;--bad-soft:#3d1d1a;--wait:#f2cf6a;--wait-soft:#3a3014;--focus:#8db4ff;--scrim:rgba(0,0,0,.65);color-scheme:dark}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:1rem/1.45 var(--f-body);margin:0;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.small{font-size:.9rem}.muted{color:var(--muted)}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:10px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:700 1.05rem var(--f-body);cursor:pointer;text-align:center;text-decoration:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn:active{transform:scale(.98)}
.btn.send,.btn.brass{background:var(--brass);border-color:var(--brass);color:var(--on-brass)}
.btn.primary,.btn.navy{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* header */
.hdr{background:var(--surface);border-bottom:1px solid var(--line);padding:max(10px,env(safe-area-inset-top,0px)) 16px 12px}
@media (display-mode:standalone){html{background:var(--surface)}.hdr{padding-top:calc(env(safe-area-inset-top,0px) + 12px)}}
.hdr-in{max-width:680px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font:800 19px/1.15 var(--f-body);white-space:nowrap}
.brand span{font-size:13.5px;color:var(--muted)}
.hbtns{display:flex;gap:8px;flex:none}
.ib{appearance:none;width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;font:800 17px var(--f-body);text-decoration:none;flex:none;-webkit-tap-highlight-color:transparent}
.ib svg{width:24px;height:24px}
.ib:disabled{opacity:.35;cursor:default}
/* views */
.wrap{max-width:680px;margin:0 auto;padding:16px 16px 28px;display:grid;gap:14px}
.wrap>*{min-width:0}
h1.pg{margin:0;font:800 1.6rem/1.15 var(--f-body)}
.sec{font-weight:700;color:var(--muted);margin-top:4px}
.month{font:800 1.15rem var(--f-body);margin-top:6px}
/* notes */
.msg{background:var(--brass-soft);border:2px solid color-mix(in srgb,var(--brass) 45%,transparent);border-radius:16px;padding:14px;display:grid;gap:10px}
.msg.read{background:var(--surface);border-color:var(--line)}
.msg .from{font-weight:700;color:var(--brass);font-size:.92rem}
.msg.read .from{color:var(--muted)}
.msg .nt{font-size:1.05rem;white-space:pre-wrap;overflow-wrap:anywhere}
.msg .nt a{color:var(--navy)}
.more{font-size:.92rem;color:var(--muted)}
/* date card */
.dc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:12px}
.dh{display:grid;gap:2px}
.dd{font:800 1.3rem/1.15 var(--f-body)}
.dk{color:var(--muted)}
.ev{color:var(--brass);font-weight:700}
.st{display:flex;align-items:center;gap:10px;font-weight:700;padding:10px 12px;border-radius:12px}
.st svg{width:24px;height:24px;flex:none}
.st small{display:block;font-weight:400;font-size:.85rem;color:var(--muted)}
.st.in{background:var(--ok-soft);color:var(--ok)}
.st.away{background:var(--bad-soft);color:var(--bad)}
.st.awaysent,.st.insent{background:var(--wait-soft);color:var(--wait)}
.st.usual{background:var(--bg);color:var(--muted)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair .btn{min-height:58px;padding:8px 6px;font-size:1rem}
.pair .btn.yes[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.pair .btn.no[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.who{color:var(--muted)}
.who b{color:var(--ink)}
ol.mus{margin:0;padding-left:1.4em;display:grid;gap:8px}
.mrow{display:flex;justify-content:space-between;gap:8px;align-items:center}
.mrow>div{min-width:0}
.mrow b{font-weight:700}
.mrow .mi{display:block;color:var(--muted);font-size:.88rem}
.mrow .tag{color:var(--brass);font-weight:700;font-size:.85rem}
.recb{appearance:none;flex:none;display:inline-flex;align-items:center;gap:5px;min-height:46px;padding:0 14px;border-radius:999px;border:2px solid var(--brass);background:var(--surface);color:var(--brass);font:700 .9rem var(--f-body);cursor:pointer}
.recb svg{width:18px;height:18px}
/* my dates */
.dhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-grid;grid-template-columns:1fr 1fr;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{appearance:none;border:0;background:none;color:var(--muted);min-height:48px;padding:0 12px;font:700 .92rem var(--f-body);display:flex;align-items:center;gap:6px;cursor:pointer}
.seg button svg{width:20px;height:20px}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy)}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:8px}
.cal .ch{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cal .ch b{font:800 1.15rem var(--f-body)}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;text-align:center}
.grid7 .dow{font-size:.8rem;font-weight:700;color:var(--muted)}
.grid7 .d{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;font-weight:700;color:var(--muted);font-size:.95rem;min-width:0}
.grid7 button.d{appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;padding:0;width:100%;font:800 1rem var(--f-body)}
.grid7 button.d.in{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.grid7 button.d.away{background:var(--bad);color:var(--surface);border-color:transparent}
.grid7 button.d.usual{background:var(--bg);color:var(--muted);border-style:dotted}
.grid7 button.d.awaysent,.grid7 button.d.insent{background:var(--wait-soft);color:var(--wait);border:2px dashed var(--wait)}
.grid7 button.d.sel{outline:3px solid var(--navy);outline-offset:1px}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;color:var(--muted)}
.leg i{display:inline-block;width:15px;height:15px;border-radius:4px;vertical-align:-2px;margin-right:6px}
/* tab bar */
.tbar{position:fixed;left:0;right:0;bottom:0;z-index:12;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.tbar button{appearance:none;border:0;background:none;color:var(--muted);display:grid;justify-items:center;gap:2px;padding:6px 2px;min-height:62px;font:700 14.5px var(--f-body);cursor:pointer;border-radius:12px;position:relative;-webkit-tap-highlight-color:transparent}
.tbar button svg{width:28px;height:28px}
.tbar button[aria-current="page"]{color:var(--navy);background:color-mix(in srgb,var(--navy) 13%,transparent)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:999px;font-size:.78rem;min-width:22px;height:22px;display:grid;place-items:center;padding:0 6px}
/* toast */
.toast{position:fixed;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:14;max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;font-weight:700;box-shadow:0 8px 28px rgba(0,0,0,.3)}
.toast .ttxt{flex:1;min-width:0}
.toast .ttxt small{display:block;font-weight:400;font-size:.85rem;opacity:.85}
.toast button{appearance:none;border:2px solid var(--bg);background:transparent;color:var(--bg);border-radius:12px;min-height:48px;padding:0 16px;font:700 1rem var(--f-body);cursor:pointer;flex:none}
.tcount{position:relative;width:42px;height:42px;flex:none}
.tcount svg{width:42px;height:42px;transform:rotate(-90deg)}
.tcount .trk{fill:none;stroke:color-mix(in srgb,var(--bg) 30%,transparent);stroke-width:3.5}
.tcount .drn{fill:none;stroke:var(--bg);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:94.25;stroke-dashoffset:0;animation:drain 5s linear forwards}
@keyframes drain{to{stroke-dashoffset:94.25}}
.tcount b{position:absolute;inset:0;display:grid;place-items:center;font-size:1rem}
/* sheets */
.sheet{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet .inner{background:var(--surface);width:100%;max-width:600px;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;max-height:90vh;overflow-y:auto;overscroll-behavior:contain}
.sheet h2{margin:0;font:800 1.35rem/1.2 var(--f-body)}
.sheet .sub{color:var(--muted)}
.reasons{display:flex;flex-wrap:wrap;gap:8px}
.reasons button{appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:10px 16px;min-height:50px;font:700 1rem var(--f-body);cursor:pointer}
.reasons button[aria-pressed="true"]{border-color:var(--navy);background:color-mix(in srgb,var(--navy) 15%,var(--surface))}
.sheet input[type=text],.sheet input[type=date],.sheet select{width:100%;min-height:54px;font-size:1.05rem;border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface)}
.fl{display:grid;gap:6px;font-weight:700}
.two{display:grid;grid-template-columns:1fr;gap:12px}
.two>*{min-width:0}
ul.ticks{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
ul.ticks li+li{border-top:1px solid var(--line)}
ul.ticks label{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 14px;cursor:pointer}
ul.ticks input{width:26px;height:26px;accent-color:var(--bad);flex:none}
ul.ticks .tk{display:grid}
ul.ticks .tk small{color:var(--muted)}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sizes button{appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;min-height:72px;cursor:pointer;font-family:var(--f-body);font-weight:800;display:grid;place-items:center;gap:2px;padding:6px}
.sizes button small{font-size:13px;font-weight:700;color:var(--muted)}
.sizes button[aria-pressed="true"]{border-color:var(--navy);box-shadow:inset 0 0 0 2px var(--navy)}
.vid{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
audio{width:100%}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg);border-radius:12px;padding:10px 14px}
.lnk{appearance:none;border:0;background:none;color:var(--navy);font:700 1rem var(--f-body);text-decoration:underline;min-height:48px;padding:0 4px;cursor:pointer}
/* sign-in and name pick (also used by the app's password gate) */
.pick{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;place-items:start center;padding:48px 16px;overflow-y:auto}
.pickcard{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:16px}
.pickcard h1{margin:0;font:800 1.6rem/1.15 var(--f-body)}
.pickcard h1 small{display:block;font:700 .9rem var(--f-body);color:var(--brass);margin-bottom:4px}
.pickcard select,.pickcard input{width:100%;min-height:56px;font-size:1.05rem;border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface)}
label.f{display:grid;gap:6px;font-weight:700}
.inst{bottom:calc(96px + env(safe-area-inset-bottom,0px))!important}
@media (prefers-reduced-motion:no-preference){.sheet .inner{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px)}}}
@media (prefers-reduced-motion:reduce){.tcount .drn{animation:none;stroke-dashoffset:47}}
</style>
<header class="hdr"><div class="hdr-in"><div class="brand"><b>Wollongong Salvos</b><span id="tbupd"></span></div><div class="hbtns"><button class="ib" id="sizeBtn" type="button" aria-label="Text size and settings">Aa</button><a class="ib" id="refresh" href="#" role="button" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg></a></div></div></header>

<main>
<div class="wrap" id="v-week">
  <h1 class="pg" id="hiName">Hi</h1>
  <div id="noteTop"></div>
  <div class="sec">This week</div>
  <div id="week" style="display:grid;gap:14px"></div>
</div>
<div class="wrap" id="v-dates" hidden>
  <div class="dhead"><h1 class="pg">My dates</h1><div class="seg" role="group" aria-label="How to show your dates"><button type="button" data-view="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>List</button><button type="button" data-view="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Calendar</button></div></div>
  <button class="btn navy wide" id="rangeBtn" type="button">Away for a few weeks?</button>
  <div id="myarea" style="display:grid;gap:12px"></div>
</div>
<div class="wrap" id="v-msg" hidden>
  <h1 class="pg">Messages</h1>

</div>
</main>

<nav class="tbar" id="tbar" aria-label="Sections">
  <button type="button" data-tab="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>This week</button>
  <button type="button" data-tab="dates"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>My dates</button>
  <button type="button" data-tab="msg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>Messages<span class="badge" id="mBadge" hidden></span></button>
</nav>
<div id="toast" class="toast" role="status" hidden></div>
<div id="pick" class="pick" hidden><div class="pickcard"><h1><small>Wollongong Salvos</small>Who are you?</h1><p class="muted">Choose your name once. This phone will remember it.</p><label class="f">Your name<select id="who"><option value="">Choose your name</option></select></label><button class="btn send" id="pickGo" disabled>Continue</button></div></div>
<div id="sheet" class="sheet" hidden><div class="inner" id="sheetInner" role="dialog" aria-modal="true"></div></div>

<style>
.gate .pickcard p{margin:0}
.gate .err{color:var(--bad);font-size:.9rem;min-height:1.3em}
.gate input[type=password]{width:100%;min-height:48px;font-size:16px}
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:40;transform:translate(-50%,-80px);display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line-strong);box-shadow:0 4px 16px rgba(0,0,0,.25);font:600 .85rem var(--f-body);color:var(--ink);pointer-events:none;opacity:0}
.ptr i{font-style:normal;display:inline-block;font-size:1.1rem;line-height:1;transition:transform .15s}

@keyframes ptrspin{to{transform:rotate(360deg)}}
.ptr.anim{transition:transform .2s ease,opacity .2s ease}
.inst{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.25);padding:14px;display:grid;gap:10px;max-width:520px;margin:0 auto}
.inst p{margin:0;font-size:.9rem}
.inst .row{justify-content:flex-end}
body.hasbar .inst{display:none}
</style>
<div id="gate" class="pick gate"><div class="pickcard">
  <h1><small>Wollongong Salvos</small><span id="gTitle">Opening…</span></h1>
  <p class="small muted" id="gMsg">Getting the latest band details.</p>
  <form id="gForm" hidden style="display:grid;gap:12px"><input id="gPw" type="password" autocomplete="current-password" placeholder="Band password" aria-label="Band password"><button class="btn send" id="gGo" type="submit">Open</button></form>
  <div class="err" id="gErr" role="alert"></div>

</div></div>
<div id="inst" class="inst" hidden></div>

<script>window.__bandBoot=function(){
(function(){
"use strict";
const D=window.__BAND_DATA__;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],MONL=["January","February","March","April","May","June","July","August","September","October","November","December"],DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],DOWL=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const P=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const kind=s=>P(s).getDay()===0?"sun":"wed";
const fmt=(s,l)=>{const d=P(s);return (l?DOW[d.getDay()]+" ":"")+d.getDate()+" "+MON[d.getMonth()]};
const fmtLong=s=>{const d=P(s);return DOWL[d.getDay()]+" "+d.getDate()+" "+MONL[d.getMonth()]};
const evOn=s=>(D.events||[]).filter(e=>s>=e.date&&s<=e.end);

(function migrate(){if(store.get("band2.migrated",false))return;
  const put=(src,want)=>{const o=store.get(src,{});for(const id in o)for(const s in o[id]){(intents[id]=intents[id]||{})[s]={want,at:Date.now()}}};
  put("band.sent","away");put("band.sentUnbacks","away");put("band.sentBacks","in");put("band.sentCancels","in");
  store.set("band2.intents",intents);store.set("band2.migrated",true)})();

const me=()=>D.members.find(x=>x.id===who);
const upcoming=()=>D.sessions.map((s,i)=>i).filter(i=>!isPast(D.sessions[i]));
// tidy intents the roster now reflects, or that are old or past
(function tidy(){const now=Date.now();
  for(const id in intents){const m=D.members.find(x=>x.id===id);
    for(const s in intents[id]){const i=D.sessions.indexOf(s),it=intents[id][s],c=m&&i>=0?m.cells[i]:null;
      if(!m||i<0||isPast(s)||now-(it.at||0)>2*86400000||(it.want==="away"&&(c==="x"||c==="p"))||(it.want==="in"&&(c===""||c==="r")&&it.base!==c))delete intents[id][s]}
    if(!Object.keys(intents[id]).length)delete intents[id]}
  store.set("band2.intents",intents)})();

function queued(mid,s){return queue&&queue.mid===mid?queue.items.find(x=>x.date===s):null}
// what this member wants for a session, and how to show it
function eff(m,i){const s=D.sessions[i],c=m.cells[i],q=queued(m.id,s),it=(intents[m.id]||{})[s];
  const pend=q||it;const want=pend?pend.want:(["x","p","s"].includes(c)?"away":"in");
  let st;
  if(want==="away")st=(!pend&&c==="x")?"away":(!pend&&c==="s")?"usual":"awaysent";
  else st=(!pend&&c==="")?"in":"insent";
  return {want,st}}
const ST={in:["You're In",""],away:["You're away",""],awaysent:["Away. Sent for Bandmaster","You'll see a red cross once it's noted"],insent:["You're In. Sent for Bandmaster","You'll see a green tick once it's noted"],usual:["Not usually on ",""]};
function statusHtml(m,i){const e=eff(m,i);let t=ST[e.st][0];if(e.st==="usual")t+=kind(D.sessions[i])==="sun"?"Sundays":"Wednesdays";
  const ic=e.st==="in"?ICON.in:e.st==="away"?ICON.away:e.st==="usual"?ICON.usual:ICON.sent;
  return '<div class="st '+e.st+'">'+ic+'<span>'+esc(t)+(ST[e.st][1]?'<small>'+ST[e.st][1]+'</small>':'')+'</span></div>'}
function pairHtml(m,i){const w=eff(m,i).want;
  return '<div class="pair"><button type="button" class="btn yes" data-set="in" data-i="'+i+'" aria-pressed="'+(w==="in")+'">I\'ll be there</button><button type="button" class="btn no" data-set="away" data-i="'+i+'" aria-pressed="'+(w==="away")+'">I\'m away</button></div>'}
const shortName=n=>{const w=String(n).trim().split(/\s+/);return w.length>1?w[0]+" "+w[w.length-1][0]:w[0]};
function awayHtml(m,i){const a=[];if(eff(m,i).want==="away")a.push("You");
  D.members.forEach(x=>{if(x.id!==m.id&&["x","p","s"].includes(x.cells[i]))a.push(shortName(x.name))});
  return '<div class="who"><b>Away:</b> '+(a.length?esc(a.join(", ")):"Nobody")+'</div>'}
const kindLabel=s=>kind(s)==="sun"?"Sunday meeting":"Practice";
function evHtml(s){const ev=evOn(s);return ev.length?'<span class="ev">★ '+esc(ev.map(e=>e.title+(e.time?", "+e.time:"")).join(" · "))+'</span>':''}

let recs=[];

  return '<ol class="mus">'+list.map(r=>{let btn="";if(r.l){btn='<button type="button" class="recb" data-rec="'+recs.length+'" aria-label="Listen to '+esc(r.t)+'">'+ICON.play+'Listen</button>';recs.push(r)}
    const tag=r.cat?r.cat:r.po?r.po+" this Sunday":"";

function cardHtml(m,i,full){const s=D.sessions[i],k=kind(s),M=D.music||{};
  let h='<article class="dc"><div class="dh"><span class="dd">'+fmt(s,true)+'</span><span class="dk">'+kindLabel(s)+'</span>'+evHtml(s)+'</div>'+statusHtml(m,i)+pairHtml(m,i);
  if(full){if(k==="wed"){const w=(M.weds||[]).find(x=>x.d===s),reh=(w&&w.reh)||[],dv=reh.find(r=>r.devo);
      if(dv)h+='<div class="who"><b>Devotions:</b> '+esc(dv.i||"Not set yet")+'</div>';
      h+='<div class="sec">Music</div>'+musicHtml(reh.filter(r=>!r.devo))}
    else{const w=(M.suns||[]).find(x=>x.d===s);h+='<div class="sec">Band music</div>'+musicHtml((w&&w.list)||[])}}
  return h+awayHtml(m,i)+'</article>'}

// ----- views -----
function renderWeek(){const m=me();recs=[];
  $("hiName").textContent=m?"Hi "+(m.short||m.name.split(" ")[0]):"Hi";
  if(!m){$("week").innerHTML="";return}
  const up=upcoming(),wi=up.find(i=>kind(D.sessions[i])==="wed"),si=up.find(i=>kind(D.sessions[i])==="sun");
  $("week").innerHTML=[wi,si].filter(i=>i!=null).sort((a,b)=>a-b).map(i=>cardHtml(m,i,true)).join("")||'<p class="muted">No band dates coming up.</p>'}
function renderDates(){const m=me(),area=$("myarea");
  for(const b of document.querySelectorAll("[data-view]"))b.setAttribute("aria-pressed",String(b.dataset.view===dview));
  if(!m){area.innerHTML="";return}
  const up=upcoming();
  if(dview==="cal"){area.innerHTML=calHtml(m,up);return}
  const shown=showAll?up:up.slice(0,10);let h="",mon=null;
  for(const i of shown){const s=D.sessions[i],mm=P(s).getMonth();if(mm!==mon){mon=mm;h+='<div class="month">'+MONL[mm]+'</div>'}h+=cardHtml(m,i,false)}
  if(!showAll&&up.length>shown.length)h+='<button type="button" class="btn wide" id="moreBtn">Show more dates, to '+fmt(D.sessions[up[up.length-1]],true)+'</button>';
  area.innerHTML=h||'<p class="muted">No band dates coming up.</p>'}
function calHtml(m,up){if(!up.length)return '<p class="muted">No band dates coming up.</p>';
  const months=[...new Set(up.map(i=>D.sessions[i].slice(0,7)))];
  if(!calM||!months.includes(calM))calM=months[0];
  const inM=up.filter(i=>D.sessions[i].startsWith(calM));if(calSel==null||!inM.includes(calSel))calSel=inM[0];
  const [y,mo]=calM.split("-").map(Number),first=new Date(y,mo-1,1),days=new Date(y,mo,0).getDate(),lead=(first.getDay()+6)%7;
  const byIso={};up.forEach(i=>byIso[D.sessions[i]]=i);
  let g='<span class="dow">M</span><span class="dow">T</span><span class="dow">W</span><span class="dow">T</span><span class="dow">F</span><span class="dow">S</span><span class="dow">S</span>';
  for(let k=0;k<lead;k++)g+='<span class="d"></span>';
  for(let d=1;d<=days;d++){const s=calM+"-"+String(d).padStart(2,"0"),i=byIso[s];
    if(i==null)g+='<span class="d">'+d+'</span>';
    else{const e=eff(m,i);g+='<button type="button" class="d '+e.st+(i===calSel?' sel':'')+'" data-day="'+i+'" aria-label="'+esc(fmtLong(s))+', '+esc(ST[e.st][0])+'">'+d+'</button>'}}
  const pi=months.indexOf(calM);
  return '<div class="cal"><div class="ch"><button type="button" class="ib" data-cm="-1" aria-label="Previous month"'+(pi<=0?' disabled':'')+'>‹</button><b>'+MONL[mo-1]+' '+y+'</b><button type="button" class="ib" data-cm="1" aria-label="Next month"'+(pi>=months.length-1?' disabled':'')+'>›</button></div>'
   +'<div class="grid7">'+g+'</div><div class="leg"><span><i style="background:var(--ok-soft);border:1px solid var(--ok)"></i>In</span><span><i style="background:var(--bad)"></i>Away</span><span><i style="border:2px dashed var(--wait)"></i>Sent</span></div></div>'
   +(calSel!=null?cardHtml(m,calSel,false):'')}
function noteHtml(n,btn){return '<div class="msg'+(btn?'':' read')+'"><span class="from">'+(btn?'From the Bandmaster':'Read')+(n.date?' · '+esc(fmt(n.date,true)):'')+'</span><div class="nt">'+linky(n.text)+'</div>'+(btn?'<button type="button" class="btn brass" data-noted="'+esc(n.id)+'">Noted</button>':'')+'</div>'}
function linky(t){return String(t||"").split(" ").map(w=>/^https?:/.test(w)?'<a href="'+esc(w)+'" target="_blank" rel="noopener">'+esc(w)+'</a>':esc(w)).join(" ")}
function notesSplit(){const N=D.notes||[],seen=store.get("band.noted",{});const isNew=n=>seen[n.id]!==n.v;return {fresh:N.filter(isNew),old:N.filter(n=>!isNew(n))}}
function renderNotes(){const {fresh,old}=notesSplit();
  $("noteTop").innerHTML=fresh.length?noteHtml(fresh[0],true)+(fresh.length>1?'<p class="more">'+(fresh.length-1)+' more in Messages</p>':''):'';
  $("msgs").innerHTML=(fresh.map(n=>noteHtml(n,true)).join("")+old.map(n=>noteHtml(n,false)).join(""))||'<p class="muted">No messages from the Bandmaster yet.</p>';
  const b=$("mBadge");b.hidden=!fresh.length;b.textContent=fresh.length}
function renderTabs(){for(const v of ["week","dates","msg"])$("v-"+v).hidden=v!==tab;
  for(const b of document.querySelectorAll("#tbar button"))if(b.dataset.tab===tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")}
function renderAll(){renderTabs();renderNotes();renderWeek();renderDates();renderToast()}
function setTab(t){tab=t;store.set("band2.tab",t);renderTabs();window.scrollTo(0,0)}

// ----- sending (one confirm, 5 second Undo, then off to the Bandmaster) -----
const UNDO_MS=5000;
const gsr=()=>window.__bandGsr||((typeof google!=="undefined"&&google.script&&google.script.run&&typeof google.script.run.sendFromPage==="function")?google.script.run:null);
function cmdFor(m,s,want,reason){const i=D.sessions.indexOf(s),c=m.cells[i];
  const au=(kind(s)==="sun"?"Sun ":"Wed ")+s.slice(8,10)+"/"+s.slice(5,7)+"/"+s.slice(0,4);
  if(want==="away")return ["r","x","s"].includes(c)?au+" UNDO AVAILABLE":au+(reason?" ("+reason.replace(/[();]/g,"")+")":"");
  return ["","p"].includes(c)?au+" CANCEL":au+" AVAILABLE"}
let qTimer=null,tickTimer=null,toastMsg=null;
function saveQ(){store.set("band2.queue",queue)}
function enqueue(m,items){if(!gsr()){showMsg("Sending isn't available on this page","Open the band app to change your dates.");return}
  if(queue)flush();
  queue={mid:m.id,items,at:Date.now()};saveQ();toastMsg=null;
  clearTimeout(qTimer);qTimer=setTimeout(flush,UNDO_MS);
  renderAll()}
function undo(){if(!queue)return;clearTimeout(qTimer);queue=null;saveQ();renderAll()}
function flush(){clearTimeout(qTimer);if(!queue)return;const q=queue,m=D.members.find(x=>x.id===q.mid),g=gsr();
  if(!m||!g){queue=null;saveQ();renderAll();return}
  const txt=q.items.map(x=>cmdFor(m,x.date,x.want,x.reason)).join("; ");
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  // show it as sent straight away; only roll back if the send fails
  const im=intents[m.id]=intents[m.id]||{};q.items.forEach(x=>{const i=D.sessions.indexOf(x.date);im[x.date]={want:x.want,at:Date.now(),base:m.cells[i]}});
  store.set("band2.intents",intents);queue=null;saveQ();renderAll();
  g.withSuccessHandler(()=>{}).withFailureHandler(()=>{q.items.forEach(x=>{delete (intents[m.id]||{})[x.date]});store.set("band2.intents",intents);
    queue=Object.assign({},q,{failed:true});saveQ();showMsg("Not sent","Check your internet connection, then tap Try again.",true)}).sendFromPage(m.formName,txt,id)}
function retry(){if(!queue)return;queue.failed=false;queue.at=Date.now()-UNDO_MS;toastMsg=null;flush()}
function showMsg(t,sub,canRetry){toastMsg={t,sub,retry:!!canRetry};renderToast();if(!canRetry){clearTimeout(showMsg._t);showMsg._t=setTimeout(()=>{toastMsg=null;renderToast()},4000)}}
function renderToast(){const el=$("toast");clearInterval(tickTimer);
  if(toastMsg){el.innerHTML='<span class="ttxt">'+esc(toastMsg.t)+(toastMsg.sub?'<small>'+esc(toastMsg.sub)+'</small>':'')+'</span>'+(toastMsg.retry?'<button type="button" data-retry>Try again</button>':'');el.hidden=false;return}
  if(!queue||queue.failed){el.hidden=true;el.innerHTML="";return}
  const left=()=>Math.max(1,Math.ceil((UNDO_MS-(Date.now()-queue.at))/1000)),el0=Math.min(UNDO_MS,Date.now()-queue.at);
  const n=queue.items.length;
  el.innerHTML='<span class="tcount" aria-hidden="true"><svg viewBox="0 0 36 36"><circle class="trk" cx="18" cy="18" r="15"/><circle class="drn" cx="18" cy="18" r="15" style="animation-delay:-'+el0+'ms"/></svg><b id="tnum">'+left()+'</b></span><span class="ttxt">Sent to the Bandmaster'+(n>1?'<small>'+n+' dates</small>':'')+'</span><button type="button" data-undo>Undo</button>';
  el.hidden=false;tickTimer=setInterval(()=>{if(!queue){clearInterval(tickTimer);return}const t=$("tnum");if(t)t.textContent=left()},250)}
// don't lose a change if the app is closed during the Undo time
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&queue&&!queue.failed)flush()});
window.addEventListener("pagehide",()=>{if(queue&&!queue.failed)flush()});

// ----- sheets -----
let sheetKind=null,reason="",pendingSet=null,rangeSel=null;
function openSheet(html,k){sheetKind=k;$("sheetInner").innerHTML=html;$("sheet").hidden=false}
function closeSheet(){$("sheet").hidden=true;$("sheetInner").innerHTML="";sheetKind=null}
const REASONS=["Holidays","Work","Unwell","Family","Other"];
function reasonsHtml(){return '<div class="reasons">'+REASONS.map(r=>'<button type="button" data-reason="'+r+'" aria-pressed="'+(reason===r)+'">'+r+'</button>').join("")+'</div>'+(reason==="Other"?'<input type="text" id="rOther" maxlength="60" placeholder="Type a short reason (optional)">':'')}
function confirmSheet(i,want){const s=D.sessions[i];pendingSet={i,want};reason="";
  if(want==="away")openSheet('<h2>Away on '+esc(fmtLong(s))+'?</h2><p class="sub">Add a reason if you like. You can skip this.</p><div id="rbox">'+reasonsHtml()+'</div><button type="button" class="btn brass" data-confirm>Yes, tell the Bandmaster</button><button type="button" class="btn" data-close>No, go back</button>',"confirm");
  else openSheet('<h2>Can make it on '+esc(fmtLong(s))+'?</h2><p class="sub">We\'ll let the Bandmaster know you\'ll be there.</p><button type="button" class="btn brass" data-confirm>Yes, tell the Bandmaster</button><button type="button" class="btn" data-close>No, go back</button>',"confirm")}

  const t=new Date(),f=iso(t),l=iso(new Date(t.getFullYear(),t.getMonth(),t.getDate()+14));
  openSheet('<h2>When are you away?</h2><div class="two"><label class="fl">First day away<input type="date" id="rgF" value="'+f+'"></label><label class="fl">Last day away<input type="date" id="rgT" value="'+l+'"></label></div><div id="rgList"></div><div class="sec">Reason (optional)</div><div id="rbox">'+reasonsHtml()+'</div><button type="button" class="btn brass" data-rgo>Yes, tell the Bandmaster</button><button type="button" class="btn" data-close>No, go back</button>',"range");
  rangeSel=null;rangeList()}
function rangeList(){const m=me(),f=$("rgF").value,t=$("rgT").value;const box=$("rgList");if(!box)return;
  const a=f&&t&&t<f?t:f,b=f&&t&&t<f?f:t;

  updRangeBtn(ds.filter(i=>rangeSel[D.sessions[i]]&&eff(m,i).want!=="away").length)}
function updRangeBtn(n){const b=document.querySelector("[data-rgo]");if(!b)return;b.disabled=!n;b.textContent=n?"Yes, tell the Bandmaster ("+n+" date"+(n>1?"s":"")+")":"No dates picked"}
function recSheet(r){const url=String(r.l||"").trim();let body="";
  const yt=ytId(url);
  if(yt)body='<div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/'+yt.id+'?rel=0&playsinline=1&autoplay=1'+(yt.start?'&start='+yt.start:'')+'" title="'+esc(r.t)+'" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div><a class="btn wide" href="'+esc(url)+'" target="_blank" rel="noopener">Open in YouTube</a><p class="small muted">If the video won\'t play here, tap Open in YouTube.</p>';
  else if(/\.(mp3|m4a|aac|wav|ogg)(\?|$)/i.test(url))body='<audio controls autoplay preload="auto" src="'+esc(url)+'"></audio>';
  else body='<a class="btn brass wide" href="'+esc(url)+'" target="_blank" rel="noopener">Open the recording</a>';
  openSheet('<span class="ev" style="font-size:.9rem">Recording</span><h2>'+esc(r.t)+'</h2>'+(r.i?'<p class="sub">'+esc(r.i)+'</p>':'')+body+'<button type="button" class="btn navy" data-close>Close</button>',"rec")}
function ytId(u){let m=u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);if(!m)return null;
  const t=u.match(/[?&#](?:t|start)=(\d+h)?(\d+m)?(\d+)s?/);let start=0;if(t)start=(parseInt(t[1])||0)*3600+(parseInt(t[2])||0)*60+(parseInt(t[3])||0);
  return {id:m[1],start}}

  const t=e.target;
  const tb=t.closest("#tbar button[data-tab]");if(tb){setTab(tb.dataset.tab);return}
  const sb=t.closest("button[data-set]");if(sb){const m=me(),i=+sb.dataset.i;if(!m)return;if(eff(m,i).want===sb.dataset.set)return;confirmSheet(i,sb.dataset.set);return}

  const nb=t.closest("button[data-noted]");if(nb){const n=(D.notes||[]).find(x=>x.id===nb.dataset.noted);if(!n)return;const seen=store.get("band.noted",{});seen[n.id]=n.v;store.set("band.noted",seen);renderNotes();return}
  const vb=t.closest("button[data-view]");if(vb){dview=vb.dataset.view;store.set("band2.dview",dview);renderDates();return}
  const cm=t.closest("button[data-cm]");if(cm){const up=upcoming(),months=[...new Set(up.map(i=>D.sessions[i].slice(0,7)))];const k=months.indexOf(calM)+(+cm.dataset.cm);if(months[k]){calM=months[k];calSel=null}renderDates();return}
  const dy=t.closest("button[data-day]");if(dy){calSel=+dy.dataset.day;renderDates();return}
  if(t.closest("#moreBtn")){showAll=true;renderDates();return}
  if(t.closest("#rangeBtn")){rangeSheet();return}
  if(t.closest("#sizeBtn")){sizeSheet();return}
  if(t.closest("[data-undo]")){undo();return}
  if(t.closest("[data-retry]")){retry();return}
});
$("sheet").addEventListener("click",e=>{const t=e.target;
  if(t===$("sheet")||t.closest("[data-close]")){closeSheet();return}
  const r=t.closest("button[data-reason]");if(r){const keep=$("rOther")?$("rOther").value:"";reason=reason===r.dataset.reason?"":r.dataset.reason;$("rbox").innerHTML=reasonsHtml();if($("rOther")){$("rOther").value=keep;$("rOther").focus()}return}
  if(t.closest("[data-confirm]")&&pendingSet){const m=me(),s=D.sessions[pendingSet.i];const it={date:s,want:pendingSet.want,reason:pendingSet.want==="away"?reasonVal():""};closeSheet();pendingSet=null;enqueue(m,[it]);return}
  if(t.closest("[data-rgo]")){const m=me(),rs=reasonVal();const items=upcoming().map(i=>D.sessions[i]).filter(s=>rangeSel&&rangeSel[s]&&eff(m,D.sessions.indexOf(s)).want!=="away").map(s=>({date:s,want:"away",reason:rs}));if(!items.length)return;closeSheet();enqueue(m,items);return}
  const f=t.closest("button[data-fs]");if(f){fs=+f.dataset.fs;store.set("band2.fs",fs);document.documentElement.style.setProperty("--fs",fs+"px");for(const b of document.querySelectorAll("[data-fs]"))b.setAttribute("aria-pressed",String(+b.dataset.fs===fs));return}
  const so=t.closest("#signOut");if(so){store.set("band.who","");try{localStorage.removeItem("band.pagepw")}catch(x){}
    if(!onAppsScript){e.preventDefault();who="";$("who").value="";$("pickGo").disabled=true;closeSheet();$("pick").hidden=false;renderAll()}}
});
$("sheet").addEventListener("change",e=>{const c=e.target.closest("input[data-rg]");if(c){rangeSel[c.dataset.rg]=c.checked;rangeList();return}
  if(e.target.id==="rgF"||e.target.id==="rgT"){rangeSel=null;rangeList()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("sheet").hidden)closeSheet()});

// ----- who are you (once per phone) -----
if(store.get("band.whoSince","")!==(D.pwSince||"")){who="";store.set("band.who","")}
const sel=$("who");
sel.innerHTML+=D.members.filter(m=>m.player).slice().sort((a,b)=>a.formName.localeCompare(b.formName)).map(m=>'<option value="'+esc(m.id)+'">'+esc(m.formName||m.name)+'</option>').join("");
sel.addEventListener("change",()=>{$("pickGo").disabled=!sel.value});
$("pickGo").addEventListener("click",()=>{if(!sel.value)return;who=sel.value;store.set("band.who",who);store.set("band.whoSince",D.pwSince||"");$("pick").hidden=true;renderAll();window.scrollTo(0,0)});
if(!who)$("pick").hidden=false;

// ----- header -----
function whenText(t){if(isNaN(t))return "";const h=t.getHours(),mi=String(t.getMinutes()).padStart(2,"0");const tm=((h%12)||12)+":"+mi+(h<12?"am":"pm");
  return t.toDateString()===new Date().toDateString()?tm:DOW[t.getDay()]+" "+t.getDate()+" "+MON[t.getMonth()]+" "+tm}
function updText(){const v=window.__bandAppVer?"v"+window.__bandAppVer+" · ":"";const st=window.__bandStatus;
  if(st&&st.checking)return v+"Checking…";
  if(st&&st.checked)return v+(st.offline?"Offline · ":"Updated ")+whenText(new Date(st.checked));
  const t=new Date(D.updatedAt||"");return v+(isNaN(t)?(D.updated?"Updated "+D.updated:""):"Updated "+whenText(t))}
(function renderTop(){$("tbupd").textContent=updText();const r=$("refresh");
  if(window.__bandRefresh)r.addEventListener("click",e=>{e.preventDefault();window.__bandRefresh()});
  else if(onAppsScript){r.href=D.form.quick;r.target="_top"}
  else r.addEventListener("click",e=>{e.preventDefault();location.reload()})})();

if(queue&&!queue.failed)setTimeout(flush,800);   // left over from last time the app was open
renderAll();
window.__bandRerender=function(){$("tbupd").textContent=updText();if(!D.members.some(m=>m.id===who)){who="";$("pick").hidden=false}renderAll()};
})();
};</script>
<script>
(function(){
"use strict";
var API="https://script.google.com/macros/s/AKfycbyicvqPU2m1jZ4yLrbjZCFO2o-fEr2UdV1A44Wgd8dOGOhgwjMjfH__ndfWq8qbjNDX/exec",KK="band.k",KD="band.data";
window.__bandAppVer="2.0";
var st={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}},del:function(k){try{localStorage.removeItem(k)}catch(e){}}};
var $=function(id){return document.getElementById(id)};
function sha(s){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ("0"+x.toString(16)).slice(-2)}).join("")})}
function call(p){var q=Object.keys(p).map(function(k){return encodeURIComponent(k)+"="+encodeURIComponent(p[k])}).join("&");
  return fetch(API+"?"+q,{redirect:"follow",cache:"no-store",keepalive:p.api==="send"}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})}
// sending from the page goes through the same API, shaped like google.script.run
function mk(ok,fail){return{withSuccessHandler:function(f){return mk(f,fail)},withFailureHandler:function(f){return mk(ok,f)},
  sendFromPage:function(n,d,id){call({api:"send",k:st.get(KK)||"",n:n,d:d,id:id}).then(function(r){
    if(r&&r.ok){ok&&ok({title:r.title,body:r.body})}else{fail&&fail(new Error((r&&r.error)||"failed"))}}).catch(function(e){fail&&fail(e)})}}}
window.__bandGsr=mk(null,null);
var booted=false;
function boot(d){window.__BAND_DATA__=d;$("gate").hidden=true;if(!booted){booted=true;window.__bandBoot();setTimeout(installHint,1500)}}
function gate(title,msg,form,err,retry){$("gate").hidden=false;$("gTitle").textContent=title;$("gMsg").textContent=msg;$("gForm").hidden=!form;$("gErr").textContent=err||"";$("gRetry").hidden=!retry;if(form)setTimeout(function(){$("gPw").focus()},50)}
function askPw(err){gate("Band password","Enter the band password once. This phone will remember it.",true,err,false)}
// Open straight away with the copy saved on this phone, then check for updates in the background.
var KT="band.checked";
function status(o){window.__bandStatus=o;if(booted&&window.__bandRerender){try{$("tbupd").textContent=""}catch(e){}window.__bandRerender()}}
function apply(d){var D=window.__BAND_DATA__;if(!D){boot(d);return}Object.keys(D).forEach(function(x){delete D[x]});Object.assign(D,d)}
var busy=false;
function check(){if(busy)return;busy=true;var k=st.get(KK)||"";var first=!booted;
  if(first)gate("Opening…","Getting the latest band details. The first time can take up to 30 seconds.",false,"",false);
  else status({checking:true,checked:+st.get(KT)||0});
  call({api:"data",k:k}).then(function(r){
    if(r&&r.ok){var t=Date.now();st.set(KD,JSON.stringify(r.data));st.set(KT,String(t));
      if(first){window.__bandStatus={checked:t};boot(r.data)}else{apply(r.data);status({checked:t})}return}
    if(r&&r.error==="password"){st.del(KK);st.del(KD);if(booted){location.reload();return}askPw(k?"The password has changed. Please enter the new one.":"");return}
    throw new Error((r&&r.error)||"unavailable")
  }).catch(function(){
    if(booted){status({checked:+st.get(KT)||0,offline:true});return}
    gate("Can't connect","The band page couldn't be reached. Check your connection and try again.",false,"",true)
  }).then(function(){busy=false})}
function start(){
  var c=st.get(KD);
  if(c&&st.get(KK)!==null){try{window.__bandStatus={checking:true};boot(JSON.parse(c))}catch(e){}}
  check()}
window.__bandRefresh=check;
// Pull down from the top of the page to refresh, like other phone apps.
(function(){var el=$("ptr"),y0=null,dy=0,PULL=70;
  function blocked(){return !booted||!$("gate").hidden||!$("pick").hidden||!$("sheet").hidden||(window.scrollY||document.documentElement.scrollTop)>0}
  function show(d){var r=Math.min(d,PULL*1.4);el.classList.remove("anim");el.style.opacity=String(Math.min(1,r/PULL));el.style.transform="translate(-50%,"+(r-60)+"px)";
    var ok=d>=PULL;el.classList.toggle("ready",ok);el.querySelector("span").textContent=ok?"Release to refresh":"Pull to refresh"}
  function hide(){el.classList.add("anim");el.classList.remove("ready","spin");el.style.opacity="0";el.style.transform="translate(-50%,-80px)"}
  document.addEventListener("touchstart",function(e){if(e.touches.length!==1||blocked()){y0=null;return}y0=e.touches[0].clientY;dy=0},{passive:true});
  document.addEventListener("touchmove",function(e){if(y0===null)return;dy=e.touches[0].clientY-y0;if(dy<=0||(window.scrollY||document.documentElement.scrollTop)>0){dy=0;hide();return}show(dy)},{passive:true});
  document.addEventListener("touchend",function(){if(y0===null)return;y0=null;
    if(dy>=PULL){el.classList.add("anim","spin");el.classList.remove("ready");el.style.opacity="1";el.style.transform="translate(-50%,10px)";el.querySelector("span").textContent="Checking for updates…";el.querySelector("i").innerHTML="&#8635;";
      check();var w=setInterval(function(){if(!busy){clearInterval(w);el.querySelector("i").innerHTML="&#8595;";hide()}},300)}
    else hide();dy=0},{passive:true});
})();
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&booted){var t=+st.get(KT)||0;if(Date.now()-t>60000)check()}});
$("gRetry").addEventListener("click",check);
$("gForm").addEventListener("submit",function(ev){ev.preventDefault();var pw=$("gPw").value.trim();if(!pw)return;
  $("gGo").disabled=true;$("gErr").textContent="Checking…";
  sha(pw).then(function(h){return call({api:"data",k:h}).then(function(r){
    if(r&&r.ok){var t=Date.now();st.set(KK,h);st.set(KD,JSON.stringify(r.data));st.set(KT,String(t));$("gPw").value="";window.__bandStatus={checked:t};boot(r.data);return}
    $("gErr").textContent=(r&&r.error==="password")?"That password is not right. Try again.":"Something went wrong. Try again."})})
  .catch(function(){$("gErr").textContent="Couldn't connect. Check your connection and try again."})
  .then(function(){$("gGo").disabled=false})});
// one-off tip on how to add the app to the home screen
var standalone=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
var deferred=null;window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferred=e});
function installHint(){if(standalone||st.get("band.instDone"))return;
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);var box=$("inst");
  if(deferred)box.innerHTML='<p><b>Install the band app</b><br>Adds the band page to your home screen.</p><div class="row"><button class="btn" id="iNo">Not now</button><button class="btn send" id="iGo">Install</button></div>';
  else if(ios)box.innerHTML='<p><b>Add to your Home Screen</b><br>In Safari, tap the Share button, then "Add to Home Screen".</p><div class="row"><button class="btn" id="iNo">Got it</button></div>';
  else return;
  box.hidden=false;
  $("iNo").addEventListener("click",function(){st.set("band.instDone","1");box.hidden=true});
  var g=$("iGo");if(g)g.addEventListener("click",function(){deferred.prompt();deferred.userChoice.then(function(){st.set("band.instDone","1");box.hidden=true})})}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
start();
})();
</script>
</body>
